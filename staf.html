<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Staf - Rekap Aspirasi DPRD Kukar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS untuk export langsung ke file Excel (.xlsx) rapi -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="text-slate-800 antialiased pb-16">

  <!-- Navbar -->
  <header class="bg-slate-900 text-white sticky top-0 z-20 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
      <div>
        <span class="text-[11px] uppercase tracking-wider text-amber-400 font-semibold block">Panel Kerja Staf • DPRD Kukar</span>
        <h1 class="text-lg font-bold leading-tight">Monitoring & Tindak Lanjut Usulan</h1>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchData()" id="refreshBtn"
          class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium px-3.5 py-2 rounded-lg transition flex items-center gap-1.5">
          <span>↻ Muat Ulang</span>
        </button>
        <button onclick="exportExcel()"
          class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg shadow-sm transition">
          ↓ Unduh Excel
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6 space-y-5">

    <!-- Ringkasan Statistik -->
    <div class="grid grid-cols-3 gap-3 sm:gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <span class="text-xs font-medium text-slate-500 block">Total Usulan</span>
        <span id="statTotal" class="text-2xl font-bold text-slate-900 mt-1 block">0</span>
      </div>
      <div class="bg-white p-4 rounded-xl border border-amber-200 bg-amber-50/30 shadow-sm">
        <span class="text-xs font-medium text-amber-700 block">Belum Dilaksanakan</span>
        <span id="statPending" class="text-2xl font-bold text-amber-600 mt-1 block">0</span>
      </div>
      <div class="bg-white p-4 rounded-xl border border-emerald-200 bg-emerald-50/30 shadow-sm">
        <span class="text-xs font-medium text-emerald-700 block">Sudah Dilaksanakan</span>
        <span id="statDone" class="text-2xl font-bold text-emerald-600 mt-1 block">0</span>
      </div>
    </div>

    <!-- Filter & Pencarian -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div>
        <label class="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Filter Kecamatan</label>
        <select id="filterKecamatan" onchange="applyFilter()"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white outline-none focus:border-slate-900">
          <option value="ALL">Semua Kecamatan (3 Dapil)</option>
          <option value="Sebulu">Sebulu</option>
          <option value="Tenggarong Seberang">Tenggarong Seberang</option>
          <option value="Muara Kaman">Muara Kaman</option>
        </select>
      </div>

      <div>
        <label class="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Filter Status</label>
        <select id="filterStatus" onchange="applyFilter()"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white outline-none focus:border-slate-900">
          <option value="ALL">Semua Status</option>
          <option value="Baru Masuk">Belum Dilaksanakan (Baru Masuk)</option>
          <option value="Sudah Dilaksanakan">Sudah Dilaksanakan</option>
        </select>
      </div>

      <div>
        <label class="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Cari Desa / Kata Kunci</label>
        <input type="text" id="searchInput" oninput="applyFilter()" placeholder="Ketik nama desa atau isi usulan..."
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900">
      </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingBox" class="text-center py-12 bg-white rounded-xl border border-slate-200">
      <div class="inline-block animate-spin rounded-full h-7 w-7 border-4 border-slate-300 border-t-slate-900 mb-2"></div>
      <p class="text-sm text-slate-500">Mengambil data dari Spreadsheet...</p>
    </div>

    <!-- Daftar Usulan (Tampilan Kartu Responsif untuk HP & Desktop) -->
    <div id="dataContainer" class="space-y-3 hidden"></div>

  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden px-5 py-3 rounded-xl shadow-lg text-sm font-medium text-white"></div>

  <script>
    // GUNAKAN URL WEB APP GOOGLE APPS SCRIPT YANG SAMA DENGAN index.html
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFDtJBVpmexKtsv9RYwmFgWQQPBYXuObg9vpfIeU_E-i1e5e5UfbJNPiV3EQHkIZGW9w/exec";

    let allData = [];
    let filteredData = [];

    function showToast(msg, isError = false) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.className = `fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl shadow-lg text-sm font-medium text-white ${isError ? 'bg-rose-600' : 'bg-slate-900'}`;
      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 3000);
    }

    async function fetchData() {
      if (SCRIPT_URL === "PASTE_URL_GOOGLE_APPS_SCRIPT_DISINI") {
        showToast("URL Apps Script belum dipasang!", true);
        return;
      }

      const loadingBox = document.getElementById("loadingBox");
      const container = document.getElementById("dataContainer");
      loadingBox.classList.remove("hidden");
      container.classList.add("hidden");

      try {
        const res = await fetch(SCRIPT_URL);
        const json = await res.json();
        
        if (json.status === "success") {
          allData = json.data;
          updateStats();
          applyFilter();
        } else {
          showToast("Gagal memuat data: " + json.message, true);
        }
      } catch (err) {
        showToast("Gagal terhubung ke Spreadsheet.", true);
      } finally {
        loadingBox.classList.add("hidden");
        container.classList.remove("hidden");
      }
    }

    function updateStats() {
      const total = allData.length;
      const done = allData.filter(d => d.status === "Sudah Dilaksanakan").length;
      const pending = total - done;

      document.getElementById("statTotal").textContent = total;
      document.getElementById("statPending").textContent = pending;
      document.getElementById("statDone").textContent = done;
    }

    function applyFilter() {
      const kec = document.getElementById("filterKecamatan").value;
      const status = document.getElementById("filterStatus").value;
      const keyword = document.getElementById("searchInput").value.toLowerCase().trim();

      filteredData = allData.filter(item => {
        const matchKec = kec === "ALL" || item.kecamatan === kec;
        const matchStatus = status === "ALL" || item.status === status;
        const matchKey = !keyword || 
          item.desa.toLowerCase().includes(keyword) || 
          item.lokasi.toLowerCase().includes(keyword) || 
          item.uraian.toLowerCase().includes(keyword);
        return matchKec && matchStatus && matchKey;
      });

      renderList();
    }

    function renderList() {
      const container = document.getElementById("dataContainer");

      if (filteredData.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-xl border border-slate-200 p-10 text-center text-sm text-slate-400">
            Tidak ada data usulan yang sesuai filter.
          </div>`;
        return;
      }

      container.innerHTML = filteredData.map(item => {
        const isDone = item.status === "Sudah Dilaksanakan";
        
        return `
        <div class="bg-white rounded-xl border ${isDone ? 'border-emerald-200 bg-emerald-50/10' : 'border-slate-200'} p-4 sm:p-5 shadow-sm transition flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div class="space-y-1.5 flex-1">
            <div class="flex flex-wrap items-center gap-2">
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-md bg-slate-100 text-slate-800">
                Kec. ${item.kecamatan}
              </span>
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-md bg-amber-100 text-amber-900">
                Desa ${item.desa}
              </span>
              <span class="text-[11px] text-slate-400">• ${item.timestamp}</span>
            </div>

            ${item.lokasi ? `<div class="text-xs font-semibold text-slate-600">Lokasi: ${item.lokasi}</div>` : ''}
            
            <p class="text-sm text-slate-800 leading-relaxed whitespace-pre-line pt-1">${item.uraian}</p>
          </div>

          <!-- Tombol Aksi Status -->
          <div class="flex sm:flex-col items-center sm:items-end justify-between border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-100 gap-2 shrink-0">
            <span class="text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full ${isDone ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
              ${isDone ? '✓ Sudah Dilaksanakan' : '⏳ Belum Dilaksanakan'}
            </span>

            ${!isDone ? `
              <button onclick="toggleStatus(${item.row}, 'Sudah Dilaksanakan', this)"
                class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-xs font-semibold px-3.5 py-2 rounded-lg shadow-sm transition">
                Tandai Selesai
              </button>
            ` : `
              <button onclick="toggleStatus(${item.row}, 'Baru Masuk', this)"
                class="text-[11px] text-slate-400 hover:text-slate-600 underline">
                Batalkan Status
              </button>
            `}
          </div>
        </div>
        `;
      }).join("");
    }

    async function toggleStatus(rowNumber, newStatus, btnElement) {
      const originalText = btnElement.textContent;
      btnElement.disabled = true;
      btnElement.textContent = "Menyimpan...";

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "updateStatus",
            row: rowNumber,
            status: newStatus
          })
        });

        // Update state lokal langsung agar responsif tanpa harus reload penuh
        const target = allData.find(d => d.row === rowNumber);
        if (target) target.status = newStatus;
        
        updateStats();
        applyFilter();
        showToast(newStatus === "Sudah Dilaksanakan" ? "Ditandai Sudah Dilaksanakan!" : "Status dikembalikan.");

      } catch (err) {
        showToast("Gagal memperbarui status.", true);
        btnElement.disabled = false;
        btnElement.textContent = originalText;
      }
    }

    function exportExcel() {
      if (filteredData.length === 0) {
        showToast("Tidak ada data untuk diunduh.", true);
        return;
      }

      const excelRows = filteredData.map((item, idx) => ({
        "No": idx + 1,
        "Waktu Input": item.timestamp,
        "Kecamatan": item.kecamatan,
        "Desa": item.desa,
        "Lokasi Spesifik": item.lokasi,
        "Uraian Usulan": item.uraian,
        "Status": item.status
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Rekap Usulan");
      XLSX.writeFile(workbook, `Rekap_Usulan_DPRD_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // Muat data saat halaman dibuka
    fetchData();
  </script>
</body>
</html>
